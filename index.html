
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075b42">
  <meta name="description" content="صحتك فلاحي - نظام الموارد البشرية والتقارير اليومية">
  <title>صحتك فلاحي | رجعنالك عافية زمان</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- تسجيل الدخول -->
  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <h1>صحتك فلاحي</h1>
        <p>رجعنالك عافية زمان</p>
      </div>

      <h2>تسجيل الدخول</h2>
      <p>سجّل دخولك للوصول إلى نظام الموظفين</p>

      <form id="loginForm">
        <label for="loginCode">كود الموظف</label>
        <input
          id="loginCode"
          name="code"
          type="text"
          autocomplete="username"
          required
          placeholder="أدخل كود الموظف"
        >

        <label for="loginPassword">كلمة المرور</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="أدخل كلمة المرور"
        >

        <button type="submit" class="btn btn-primary">
          تسجيل الدخول
        </button>
      </form>
    </div>
  </section>

  <!-- التطبيق -->
  <div id="appView" hidden>
    <header class="topbar">
      <button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="فتح القائمة"
      >☰</button>

      <div class="topbar-brand">
        <strong>صحتك فلاحي</strong>
        <span>رجعنالك عافية زمان</span>
      </div>

      <div class="topbar-actions">
        <span id="headerEmployeeName"></span>
        <button id="logoutBtn" class="btn btn-outline" type="button">
          تسجيل الخروج
        </button>
      </div>
    </header>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar">
        <div class="profile">
          <div class="profile-avatar">ص</div>
          <div>
            <strong id="employeeName"></strong>
            <span id="employeeRole"></span>
          </div>
        </div>

        <div class="sidebar-heading">القائمة الرئيسية</div>

        <nav aria-label="القائمة الرئيسية">
          <button
            data-page="home"
            class="nav-item active"
            type="button"
          >الرئيسية</button>

          <button
            data-page="report"
            class="nav-item"
            type="button"
          >التقرير اليومي</button>

          <button
            data-page="complaints"
            class="nav-item"
            type="button"
          >الشكاوى والمقترحات</button>

          <button
            data-page="employeeReports"
            class="nav-item manager-only"
            type="button"
            hidden
          >تقارير الموظفين</button>

          <button
            data-page="employees"
            class="nav-item admin-only"
            type="button"
            hidden
          >إضافة الموظفين</button>

          <button
            data-page="permissions"
            class="nav-item admin-only"
            type="button"
            hidden
          >إدارة الصلاحيات</button>

          <button
            data-page="admin"
            class="nav-item admin-only"
            type="button"
            hidden
          >لوحة الإدارة</button>

          <button
            data-page="password"
            class="nav-item"
            type="button"
          >تغيير كلمة المرور</button>

          <button
            data-page="passwordLog"
            class="nav-item admin-only"
            type="button"
            hidden
          >سجل كلمات المرور</button>
        </nav>

        <div class="sidebar-tag">
          <span>صحتك فلاحي</span>
          <small>نظام إدارة الموظفين</small>
        </div>
      </aside>

      <main class="main">
        <div id="pageContent"></div>

        <footer class="app-footer">
          صحتك فلاحي — نظام الموارد البشرية والتقارير اليومية
        </footer>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
